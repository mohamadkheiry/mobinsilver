# این دو server block باید داخل بخش http پیکربندی Nginx قرار گیرند.
# در زیرساخت فعلی، ترافیک عمومی TLS از stream:443 به http:4443 هدایت می‌شود.

server {
    listen 80;
    server_name mobinsilver.00f.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/ssl/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 4443 ssl;
    server_name mobinsilver.00f.ir;

    ssl_certificate /etc/nginx/ssl/mobinsilver.00f.ir/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mobinsilver.00f.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MobinSilverSSL:10m;
    ssl_session_tickets off;

    client_max_body_size 8m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; upgrade-insecure-requests" always;

    location / {
        proxy_pass http://192.168.10.111:5098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_redirect off;
    }
}
