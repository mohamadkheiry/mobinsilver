name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore src/MobinSilver.Api/MobinSilver.Api.csproj

      - name: Build
        run: dotnet build src/MobinSilver.Api/MobinSilver.Api.csproj -c Release --no-restore

  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mobin-silver-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/mobin-silver-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/mobin-silver-web/package-lock.json

      - name: Install dependencies
        working-directory: src/mobin-silver-web
        run: npm ci

      - name: Install Chromium
        working-directory: src/mobin-silver-web
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          dotnet run --project src/MobinSilver.Api/MobinSilver.Api.csproj --urls http://127.0.0.1:5088 > api.log 2>&1 &
          (cd src/mobin-silver-web && npm run dev > ../../web.log 2>&1) &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:5088/api/health >/dev/null && curl --fail --silent http://127.0.0.1:5173 >/dev/null && exit 0
            sleep 2
          done
          cat api.log web.log
          exit 1

      - name: Run Playwright tests
        working-directory: src/mobin-silver-web
        run: npm run test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: src/mobin-silver-web/test-results
